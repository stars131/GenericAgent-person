# Tauri release builds — placeholder for Phase 2.
#
# This workflow is intentionally `workflow_dispatch`-only until we have:
#   - Code-signing certificates (Apple Developer ID + Windows EV)
#   - An icon set under gui/src-tauri/icons/
#   - A versioning policy (Conventional Commits → semantic-release)
#
# Once those land, switch the trigger to `release: types: [published]`
# and remove the `if: false` guard on each job.

name: Tauri build

on:
  workflow_dispatch:

jobs:
  build:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: System deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: ga-gui-${{ matrix.os }}
          path: gui/src-tauri/target/release/bundle/
